name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  baseline:
    name: baseline stands alone
    runs-on: ubuntu-latest
    services:
      postgres:
        # The check needs nothing of Supabase's image: the bootstrap provides
        # the platform shapes, and `public` is handed to the baseline empty.
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOCAL_PG_HOST: 127.0.0.1
      LOCAL_PG_PORT: "55432"
      LOCAL_PG_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: psql client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: baseline check
        run: npm run db:baseline:check
      # The media block a property carries across the network is composed in
      # SQL and its document links must be the ones the portal's TypeScript
      # lists. Both, and the photographs it may send, are proved against a
      # database rebuilt the same way as above.
      - name: a property's media crosses the network intact
        run: npm run db:media-contract:check

  edge:
    name: edge functions typecheck + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install toolchain (deno via npm)
        run: npm install --no-audit --no-fund
      - name: verify_jwt declared for every function
        run: npm run check:verify-jwt
      - name: runtime references no removed schema objects
        run: npm run check:schema-refs
      # A version records ONE ledger row, so a second file carrying it can never
      # be told apart from applied. This repository shipped that defect green:
      # 20260917090000 was held by two migrations and nothing here could see it.
      - name: every migration has its own version
        run: npm run check:migration-versions
      # And runs after what it needs. A version is the ORDER a migration runs in,
      # and no gate anywhere read two migrations together until this one: the
      # fault it catches reached a merged pull request on the clone side, where a
      # file altered a table three migrations of its own had not created yet.
      - name: a migration runs after the objects it needs
        run: npm run check:migration-order
      - name: portal security check
        run: npm run security:portal
      - name: every credential door is budgeted, and none trusts X-Forwarded-For
        run: npm run check:rate-limit-coverage
      # The explicit list this replaced had drifted: `builder-network-stock-image`
      # was added to the repository and never added here, so the one
      # unauthenticated endpoint in the product was the one function CI did not
      # typecheck. `typecheck:edge` globs `builder-*`, so a function cannot be
      # added without being checked.
      - name: deno typecheck (strict, whole runtime)
        run: npm run typecheck:edge

  frontend:
    name: frontend typecheck + specs + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm install --no-audit --no-fund
      - name: strict typecheck
        run: npm run typecheck
      - name: specs (mounted-usage, identity, hidden sections, components)
        run: npm test
      - name: production build
        run: npm run build

  pdf-worker:
    name: pdf election worker builds and elects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fixture toolchain
        run: pip install --quiet reportlab pillow
      - name: install
        working-directory: workers/builder-stock-pdf-worker
        run: npm install --no-audit --no-fund
      # `build.mjs` fails the build when the unpdf pin drifts from the URL
      # `pdfText.ts` loads, and when the bundle does not contain the shared
      # election — so a worker carrying its own private copy of the algorithm
      # cannot pass this step.
      - name: build (asserts the shared election is what got bundled)
        working-directory: workers/builder-stock-pdf-worker
        run: npm run build
      # Drives the exact deployable artefact: auth, routing, the lane, and a
      # real election over a real brochure and an 8 MB twelve-page document.
      - name: canary the bundle
        working-directory: workers/builder-stock-pdf-worker
        run: node scripts/canary.mjs --heavy
