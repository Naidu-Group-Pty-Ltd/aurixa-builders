name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  baseline:
    name: baseline stands alone
    runs-on: ubuntu-latest
    services:
      postgres:
        # The check needs nothing of Supabase's image: the bootstrap provides
        # the platform shapes, and `public` is handed to the baseline empty.
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOCAL_PG_HOST: 127.0.0.1
      LOCAL_PG_PORT: "55432"
      LOCAL_PG_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: psql client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: baseline check
        run: npm run db:baseline:check

  edge:
    name: edge functions typecheck + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install toolchain (deno via npm)
        run: npm install --no-audit --no-fund
      - name: verify_jwt declared for every function
        run: npm run check:verify-jwt
      - name: runtime references no removed schema objects
        run: npm run check:schema-refs
      - name: portal security check
        run: npm run security:portal
      - name: deno typecheck (strict, whole runtime)
        run: npx deno check --config supabase/functions/deno.json supabase/functions/builder-portal-login/index.ts supabase/functions/builder-portal-logout/index.ts supabase/functions/builder-portal-verify/index.ts supabase/functions/builder-portal-accept-invite/index.ts supabase/functions/builder-portal-forgot-password/index.ts supabase/functions/builder-portal-reset-password/index.ts supabase/functions/builder-portal-change-password/index.ts supabase/functions/builder-portal-invite/index.ts supabase/functions/builder-portal-register/index.ts supabase/functions/builder-portal-verify-email/index.ts supabase/functions/builder-portal-projects/index.ts supabase/functions/builder-portal-inventory/index.ts supabase/functions/builder-portal-transactions/index.ts supabase/functions/builder-portal-construction/index.ts supabase/functions/builder-portal-delivery/index.ts supabase/functions/builder-portal-collaboration/index.ts supabase/functions/builder-portal-workspace/index.ts supabase/functions/builder-portal-stock/index.ts supabase/functions/builder-network-admin/index.ts supabase/functions/builder-network-connections/index.ts supabase/functions/builder-network-inbound/index.ts supabase/functions/builder-network-outbox-worker/index.ts supabase/functions/builder-document-processor/index.ts supabase/functions/builder-stock-image-settler/index.ts supabase/functions/builder-stock-link-callback/index.ts

  frontend:
    name: frontend typecheck + specs + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm install --no-audit --no-fund
      - name: strict typecheck
        run: npm run typecheck
      - name: specs (mounted-usage, identity, hidden sections, components)
        run: npm test
      - name: production build
        run: npm run build
