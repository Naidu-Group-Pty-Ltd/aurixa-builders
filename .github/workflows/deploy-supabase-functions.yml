name: Deploy Supabase schema and functions

# Ships the network's schema and edge runtime to project htfluofznhxeumblwbww.
#
# The prime's workflow of the same name carries the whole story of why this
# exists (a green merge is not a deploy, and the gap is silent by
# construction); this edition inherits its one hard rule: when functions
# change and there is no credential to ship them with, the check FAILS —
# a red check on an unconfigured repo is the cheapest version of the lesson.
#
# The network is simpler than the prime on purpose: every function deploys
# on every trigger (25 functions, one product, no changed-list derivation),
# and `supabase/config.toml` carries the verify_jwt declaration for each —
# the CLI reads it, and check-verify-jwt-declared.mjs in ci.yml keeps the
# file complete.
#
# MIGRATIONS RUN FIRST, and they did not run at all until 18 Sep 2026. This
# workflow shipped functions and nothing shipped schema: no job here applied a
# migration and CI never noticed that a branch had added a table production had
# never seen. `20260918100500_builder_access_requests.sql` merged green,
# deployed its function, and left the database behind — the function then
# answered every public applicant a 500 (`PGRST205`, table not in the schema
# cache) and the first person to find out was a user filling in the form.
#
# The order is the fix and it is not interchangeable: a function deployed
# against a table that does not exist yet IS that outage. Schema, then code.
#
# Required repository secret: SUPABASE_ACCESS_TOKEN (a personal access token
# from supabase.com/dashboard/account/tokens with access to the
# Naidu Group organisation). The migration lane deliberately uses the same
# token rather than a database password, so it needed no new secret to start
# working — a lane that cannot run until somebody adds one is a lane that
# stays unrun.

on:
  push:
    # MAIN ONLY. The development branch that bootstrapped the repo shipped to
    # production on push while it existed; that lane is closed — production
    # deploys ride main, and anything else is a workflow_dispatch someone
    # chose to run.
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/ops/apply-migrations.mjs'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: htfluofznhxeumblwbww

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refuse to pretend
        if: ${{ env.TOKEN == '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo '::error::Edge functions are due to deploy but no SUPABASE_ACCESS_TOKEN secret is configured — nothing was shipped. Add it in Settings → Secrets and variables → Actions (mint at supabase.com/dashboard/account/tokens), then re-run.'
          exit 1

      # SCHEMA BEFORE CODE. A function deployed against a table that does not
      # exist is the outage this lane was added for.
      - name: apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ops/apply-migrations.mjs

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: deploy every function (config.toml carries verify_jwt)
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Recorded BEFORE the first upload so the verification step below can
          # tell "shipped by this run" from "left over from the last one".
          echo "started_at=$(date +%s000)" >> "$GITHUB_OUTPUT"
          failed=""
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            [ "$fn" = "_shared" ] && continue
            echo "::group::deploy $fn"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api; then
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::deploy failed for:$failed"
            exit 1
          fi

      # The CLI's own exit code is not evidence. On 16 Sep 2026 it reported
      # success for all 26 functions while shipping only the first one, leaving
      # a closed security door open in production behind a green check. This
      # step asks the Management API what is actually deployed and fails on a
      # partial deploy — the state where production runs a mixture of builds
      # and nobody is told.
      - name: confirm every function actually shipped
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ops/verify-functions-deployed.mjs "${{ steps.deploy.outputs.started_at }}"

      - name: set platform configuration secrets (never vendor keys)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SESSION_PEPPER: ${{ secrets.NETWORK_SESSION_PEPPER }}
          INTERNAL_SECRET: ${{ secrets.NETWORK_INTERNAL_SECRET }}
          PROXY_SHARED_SECRET: ${{ secrets.PORTAL_PROXY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # Public configuration ships from source; credentials only when the
          # repository actually holds them — an empty write would blank a
          # secret somebody set by hand.
          # RESEND_FROM_EMAIL is the ONE address this project's Resend key may
          # send from (brand-config.ts resolves the sender from it first). Its
          # domain, send.builders.aurixasystems.com.au, must be verified in the
          # Resend account whose RESEND_API_KEY this project holds, or every
          # send answers 403 and nothing delivers — the pairing rule the file's
          # header records. Public configuration, so it ships from source.
          supabase secrets set --project-ref "$PROJECT_REF" \
            APP_BASE_URL=https://builders.aurixasystems.com.au \
            MISSION_CONTROL_URL=https://mission-control.aurixasystems.com.au \
            ALLOWED_ORIGINS=https://builders.aurixasystems.com.au \
            RESEND_FROM_EMAIL=noreply@send.builders.aurixasystems.com.au
          if [ -n "${SESSION_PEPPER:-}" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" SESSION_TOKEN_PEPPER="$SESSION_PEPPER"
          fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" INTERNAL_EDGE_SECRET="$INTERNAL_SECRET"
          fi
          # The half of the proxy handshake that lives here. The SAME value must
          # also be set as PORTAL_PROXY_SHARED_SECRET in the Vercel project, or
          # the runtime keeps bucketing per-IP ceilings on the proxy's own
          # address — one ceiling shared by every browser user at once. Absent
          # on either side the handshake simply does not happen and behaviour is
          # unchanged, which is why setting only one side is safe but useless.
          if [ -n "${PROXY_SHARED_SECRET:-}" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" PORTAL_PROXY_SHARED_SECRET="$PROXY_SHARED_SECRET"
          fi
