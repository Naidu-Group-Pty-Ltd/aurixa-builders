name: Production rollout

# Applies pending database migrations to the LIVE Supabase project and runs
# the production smoke suite — the repository's migration procedure from the
# remediation onward. Manual dispatch only, one phase at a time:
#
#   verify   read-only: live ledger, pending migrations, divergence, vault
#            entry names, extensions, cron jobs. Run this first, always.
#   apply    apply pending migrations in order (never the baseline), record
#            them in the ledger, prove the remediation objects, ensure
#            pg_cron/pg_net + the two network driver schedules, and seed the
#            Vault entries the signed cron invoker reads.
#   proxy-trust
#            proves the portal proxy's client-IP handshake against the LIVE
#            system: that the runtime holds PORTAL_PROXY_SHARED_SECRET, that a
#            proxied call is charged to the BROWSER's address rather than the
#            proxy's, and that a direct caller claiming someone else's address
#            is ignored without the token. Creates no account and no business
#            row; deletes the identifier buckets it makes.
#   smoke    controlled end-to-end tests over the deployed portal: the
#            governance journey, self-registration, the active surfaces,
#            the Stock List including a live HMAC-signed selection
#            announcement round trip, and cleanup of every test row.
#   recover  the one-time (re-runnable, idempotent) historical recovery for
#            the stock image invariant: re-opens served/staged properties
#            without a ready builder-source photograph back through the
#            corrected pipeline, kicks the workers, flips the temporary
#            invariant scoping to universal as coverage is earned.
#   forensics read-only source audit for properties still without a ready
#            builder-source photograph: fetches every link their stored rows
#            carry (resolving Drive's virus-scan interstitial), censuses each
#            PDF page-by-page with the pipeline's own readers, and replays the
#            pipeline's own recovery/election per branch. Writes nothing.
#   item-state
#            read-only: the exact stored state of named stock items — the rows
#            themselves, their branch records, their stored images and the
#            uploads either side of the cutover. Answers "what does the
#            database say happened to these rows", which is the question that
#            comes before what their documents contain. Runs SELECT only, and
#            refuses any statement that is not one. Writes nothing.
#            Ids come from the `items` input, defaulting to the five the
#            18 September import retired.
#   stock-collateral-reprocess
#            sends every ACTIVE property whose card is led by a picture from a
#            column the builder's own heading declares to be estate or plan
#            collateral back to `source`, so the corrected pipeline reads the
#            brochure it never opened. Selected BY THE RULE
#            (`columnDeclaration.pure.ts`, imported rather than restated) and
#            never by a list of ids. Writes only the image work state: no
#            image, no primary, no lifecycle, no publication, and it deletes
#            nothing. DRY RUN unless `apply` is true; idempotent.
#            MUST RUN AFTER the functions carrying the rule are deployed — the
#            old code still counts a masterplan as a ready image and would
#            re-settle every row this resets.
#   item-reopen
#            the narrowest recovery for a property the two 18 September defects
#            retired: removes ONLY the banked branch verdicts that match those
#            two signatures — a recovery whose image is not marketplace
#            eligible, and the row's own `Brochure URL` banked as naming no
#            image — and resets the work state. Writes no image, sets no
#            primary, settles nothing, publishes nothing, never touches
#            `lifecycle_status`. DRY RUN unless `apply` is true; idempotent.
#   network-sync-state
#            read-only: THIS end of the Network -> Clone stock sync, printed in
#            the order an event travels it — the catalogue, the connection the
#            events are addressed to, the enqueue's own organisation join, the
#            three producer triggers and whether they are enabled, the outbox
#            by status, the worker's cron driver, and `net._http_response`,
#            which is the honest signal because pg_cron reports on the SQL that
#            QUEUED the HTTP call and never on the call. Its counterpart is
#            `builder-network-sync-state` on `npc-property-dashbord`: a stopped
#            mirror can be caused at either end and neither database can see
#            the other. Runs SELECT only and refuses any statement that is not
#            one. Enqueues nothing, backfills nothing, delivers nothing.
#   portal-scope-state
#            read-only: WHOSE stock a builder's own Stock List page would draw.
#            Every read in `builder-portal-stock` is scoped by one value — the
#            session's active organisation — so an empty page and a full
#            marketplace can both be correct answers about two different
#            organisations, and the screen cannot tell you which. Prints what
#            each organisation holds, which organisations each portal user can
#            actually reach (through the session resolver's own function), what
#            each live session is acting as, the two page reads replayed per
#            user, and who uploaded each stock list beside who owns it. Runs
#            SELECT only and refuses any statement that is not one. Grants
#            nothing, re-points nothing, writes nothing.
#   stock-source-restore
#            puts back a stock list the builder deleted in order to re-import
#            it — the exact inverse of ONE logged `builder_stock_source_deleted`
#            and nothing more. It imports nothing, fetches nothing and creates
#            no upload row. The photograph rule is NOT relaxed to restore a
#            row: a property returns to `active` only where
#            `builder_stock_photo_is_source_ready` says it holds a ready
#            builder-source photograph, and everything else returns to `staged`,
#            which is where publication would have left it. It refuses unless
#            the count matches what that delete recorded (something else has
#            touched the catalogue since), refuses if a newer undeleted upload
#            is already supplying active stock, and asserts by re-reading.
#            Takes `upload_id`. DRY RUN unless `apply` is true; idempotent.
#   stock-reading-trace
#            read-only: what the deterministic PDF reader SAW in named stored
#            documents and what it made of them — the flattened page text, every
#            positioned run with its size, the reader's own lines and cells, and
#            the reading with the lines it set aside. Runs the pipeline's own
#            readers over the stored bytes with the inputs the import hands
#            them. Takes `upload_id` (one or more, comma-separated). SELECT and
#            a storage GET only; writes nothing.
#   stock-overlay-audit
#            read-only: every distinct stored picture with a display verdict
#            put through the marketing-overlay reading again — where each strict
#            line of type sits, whether it reaches a side of the frame, the flat
#            blocks and whether any is a brand colour — and each picture a
#            proposed rule about those lines would judge differently printed
#            for inspection. SELECT and a storage GET only; writes nothing.
#   stock-scan-proof
#            imports a SAFE fully scanned fixture (`scripts/ops/fixtures/
#            scanned-brochure-lot-57.pdf`, digest pinned in the script) through
#            the deployed product, the way a builder's browser does, into an
#            organisation of the run's own that is detached from the network in
#            the transaction that creates it — and then does nothing, so what
#            finishes the import is the product's own dispatch and continuation.
#            Reports whether the hosted runtime's recogniser came up, every page
#            recognised or refused, the engine's own refusal from the function
#            log, the property read and every invocation's HTTP status. Deletes
#            every row and object it made. `scan_expect: observe` reports;
#            `read` also requires every page recognised once and the document's
#            property read field for field.
#   stock-confirmation-proof
#            proves "Use brochure image" on the live product with the gate's own
#            SALTBUSH RISE brochures (`scripts/ops/fixtures/saltbush-lot-*.pdf`,
#            digests pinned in the script, nothing in them any customer's),
#            served from this project's storage under signed links, in an
#            organisation of the run's own that is detached from the network in
#            the transaction that creates it. Through the portal, as a builder's
#            browser: a row whose own brochure mistypes its lot is offered the
#            choice, a row linking a sibling's brochure is refused naming the
#            listing that uses it, confirming puts the brochure's own photograph
#            on the card stamped with the confirmation, and undoing takes it down
#            and brings the notice back. Deletes every row and object it made.
#   stock-project-proof
#            proves an activated property's PROJECT page on the live product: a
#            stock list (the gate's own SALTBUSH RISE brochure, digest-pinned)
#            imported in an organisation of the run's own, detached from the
#            network, whose property reads its photograph; an activation
#            delivered through the live network door over a proof-only
#            workspace connection (production-smoke's precedent) opening a
#            project; get_project and list_projects carrying the property with
#            its photograph, every figure equal to the Stock List's own read and
#            its brochure link; image_url serving the photograph's bytes and
#            refusing a foreign image and another organisation; and a party
#            added, edited and removed with project access unchanged. Deletes
#            every row, object, workspace and connection it made.
#   stock-agencies-proof
#            proves the Builder Portal's Agencies area on the live product: the
#            same organisations of the run's own and SALTBUSH RISE import as
#            stock-project-proof, an activation delivered through the live
#            network door (carrying a client label the area must never show; a
#            payload naming a client refused at the door), then
#            list_activated_properties for the organisation's builder — its
#            property, design, photograph (bytes served), agency, contact and
#            project link, and nothing withheld — and for another organisation,
#            before and after being listed as a party on the project: nothing.
#            Also checks the deployed portal serves the route and bundles the
#            area, and counts (read-only) real activations holding a client
#            label. Deletes every row, object, workspace and connection it made.
#   stock-hero-future-proof
#            proves a future upload is framed by the normal production path:
#            six invented properties (cases A–F, fixtures/hero), activated over a
#            proof-only transport, planned by the hero planner's own schedule
#            with no call from the proof, checked against each house's ground
#            truth and against the Command Centre's copy; F replaces a picture
#            and proves the re-plan. Deletes everything it made.
#   stock-media-proof
#            proves a property's photographs and documents reach the Command
#            Centre over the real signed path: a never-activated organisation of
#            the run's own, one property with two stored photographs and two
#            document links, a proof-only transport between the two LIVE inbound
#            doors; checks the figures, the one elected photograph (its bytes
#            through the network door), the typed documents and the Command
#            Centre's own get_stock_item; replay, replacement, removal and a
#            changed document; another organisation's signed payload refused; a
#            malformed media block refused while the property takes the event.
#            Reaches the Command Centre project with the same token
#            network-connection-remap uses. Deletes everything on both sides.
#   stock-messaging-proof
#            proves Step 5's messages over the real signed path, both ways: two
#            organisations of the run's own on a proof-only transport between the
#            two LIVE doors, a Command Centre activation by a proof staff member
#            (for a proof client no trigger may react to), messages from the
#            activator, a colleague, the builder (through the portal's own
#            request) and a builder colleague — each under its writer's name and
#            Delivered only on the other side's receipt; the same send repeated,
#            one order on both sides, a refusal that fails visibly and is sent
#            again once, a replayed envelope, another builder's / the wrong
#            conversation's / a malformed signed message refused with a valid one
#            behind them applied, the operational log, the exact payload keys,
#            the polling read, and a withdrawal that closes the conversation.
#            Deletes everything on both sides.
#   agency-chat-state
#            read-only: who each existing agency conversation belongs to, on
#            both projects, before one activation, one private conversation.
#   step6-proof-audit
#            read-only: counts, table by table on both projects, anything the
#            Step 6 and regression proofs could have left (proof markers and
#            rows whose parent no longer exists), and re-reads the two real
#            agency conversations. Every statement is a single SELECT.
#   agency-chat-backfill
#            binds each conversation that existed before that step to its
#            activation and seeds its activator and acknowledger — only where
#            both projects agree; everything else is reported by id. Sends no
#            notification or email. Works before the migrations (reports the
#            mapping) and after them. DRY RUN unless `apply` is true;
#            idempotent.
#   stock-private-chat-proof
#            proves one activation, one private conversation on the live
#            product with proof organisations, users and an activation of its
#            own: the acknowledgement's conversation, notification and email,
#            the company contacts, who may read, invite and leave on each side,
#            participant events converging, withdrawal, and nothing private
#            crossing. Deletes everything on both sides.
#   portal-access-proof
#            proves a brand-new builder organisation end to end on the live
#            portal: governance from empty rows, an invitation for every role,
#            the session windows (idle slide, idle and absolute expiry, logout,
#            deactivation, revocation, suspension, password change and reset),
#            the role matrix against the database resolvers, a project
#            conversation, notifications and multi-tenant isolation. Its
#            organisations are detached from every workspace in the
#            transaction that creates them. Deletes everything it creates.
#   activation-speed-proof
#            times Command Centre activations from the selection to the
#            builder portal's own list (outbox, worker, door, apply), then
#            replays one delivery with no kick to prove the cron recovers it
#            and nothing is stored twice. Disposable rows; deletes them all.
#   portal-performance-proof
#            times, on the live portal, a comparable ordinary request against
#            opening a project, posting and reading a project message — through
#            the proxy (end to end) and directly (the functions' Server-Timing
#            stages) — and re-proves who may do what. PERF_SAMPLES rounds.
#            Deletes everything it creates.
#   message-speed-proof
#            times messages both ways on the live product with an activation
#            and conversation of its own: portal reads through the proxy, each
#            side's send, database-to-database delivery, and the first read on
#            the other side that names it; proves the portal's new-message
#            read (members only, no body, the builder's own side never named,
#            writes nothing) and, in a real Chromium, the "New message from
#            <agency>" popup, Open, and an open thread refreshing without a
#            reload or a popup. `baseline` true measures whatever is deployed
#            and skips what is not there yet — never a pass for a change.
#            Playwright is installed for this phase only. Deletes everything
#            it creates.
#   email-delivery-proof
#            does a Builder email actually reach a mailbox? It first settles
#            the diagnosis from the log rather than from an opinion — the
#            recipient KIND of every invitation ever sent, counted in the
#            database, so no address is selected and no real domain is named —
#            then drives an invitation and a password reset to ONE mailbox the
#            operator supplies in `email_recipient`. The address is never
#            committed and never printed; only its domain appears. A reserved
#            name (`example.com` and the like) is refused up front, because
#            every send on record had gone to one and that is exactly why the
#            corpus could prove nothing. Creates a disposable organisation and
#            deletes it, and the mailbox's account, at the end.
#   cc-frontend-build
#            read-only: which build the Command Centre's published frontend
#            serves. Lovable reports a publish as started, never as served, so
#            this reads each origin's `/version.json` and the entry script its
#            page loads, and requires both to name the same build; `cc_build`
#            also requires that build to be that commit. Public pages only: no
#            token, no database, no write.
#   portal-browser-proof
#            opens the live portal in a real Chromium, signed in as a proof
#            organisation of its own: every live route renders, the old
#            bookmarks redirect, an open project conversation shows a reply
#            without a reload, the newer-build banner appears, phone width
#            fits. Screenshots are uploaded as the run's artifact. Playwright
#            is installed for this phase only (never saved to package.json).
#            Deletes everything it creates.
#   upload-settlement-state
#            read-only: why an upload's image settlement does not finish. For
#            each property carrying the upload, judged by the pipeline's own
#            rules (`openBranches`, `servableStoredImage`) at the versions the
#            deployed settler asks for: whether it already holds a picture the
#            repair counts, which of its branches are still open and what each
#            stored answer says — and so whether the upload-level repair owes
#            it a package recovery. Prints no link (host, kind and a digest
#            only). Runs SELECT only and refuses any statement that is not
#            one. Takes `upload_id` (one or more, comma-separated).
#   stock-field-coverage
#            read-only: how many live properties are missing each displayed
#            figure, per stock list, and for every one missing a car count or
#            a floor area, what its own stored record carries under headers
#            that read like either. Prints no link (host and a digest only).
#            Runs SELECT only and refuses any statement that is not one.
#   stock-brochure-figures
#            read-only: for every live property missing a car count or a floor
#            area, fetches its own brochure (the one its photograph came from,
#            else its Brochure URL) through the product's fetcher and runs the
#            deterministic PDF reader over it, printing the figures read and
#            whether the brochure's lot and design agree with the row's.
#            SELECT and a document GET only; prints no link; writes nothing.
#   stock-tier0-formats
#            TIER-0: every format the Stock List accepts, imported by the live
#            product exactly as a builder's browser imports it
#            (`scripts/ops/fixtures/tier0`, digests pinned, nothing any
#            customer's), each into an organisation of the run's own detached
#            from every workspace and carried over a PROOF-ONLY transport to
#            the live Command Centre door. Asserts, per format and per
#            property: parsed and stored field by field against what the
#            DOCUMENT states, served by the portal's own reads, published by
#            the product's own settler (a property its document gave no
#            photograph of gets one through the builder's own "Add picture"),
#            mirrored by the Command Centre field by field, and read back
#            through the Command Centre's own endpoint with its photograph.
#            Kicks nothing and writes no lifecycle. `items` narrows it to some
#            formats (comma-separated keys). Deletes everything on both sides.
#   stock-tier0-lifecycle
#            TIER-0: one stock list through its whole life on both products:
#            imported, published and mirrored field by field with its typed
#            documents; the builder's Stock List and the Command Centre's
#            property page rendered in a real Chromium at three widths; an
#            activation through the Command Centre's OWN select_for_client
#            (a sold property refused, the builder told THAT and never for
#            whom), acknowledged through the portal; a v2 re-upload (changed,
#            removed, blank and new rows) applied and converged; the
#            builder's own edits; a second organisation with the same estate
#            and lot; a deleted list and a withdrawn activation. Playwright is
#            installed for this phase only. Deletes everything on both sides.
#   stock-link-proof
#            a LINKED stock list — Notion or Google Sheets — through the live
#            product: each named source upload's own link is added again, by
#            `import_url` as the portal's "Add a link" does, into an
#            organisation of the run's own detached from every workspace (so
#            nothing reaches any Command Centre), and the product's own
#            dispatch, continuation and image settler finish it. Asserts one
#            property per source row, a suburb that carries none of the list's
#            design or tags, only postcodes the source states, packages on one
#            lot kept apart, and every photograph settled. The builder's own
#            rows are never touched; the log carries no link, address, price
#            or name (this repository is public). Also the dry run of that
#            builder's "Read again". Takes `upload_id`. Deletes everything.
#   stock-mirror-parity
#            READ-ONLY. One builder organisation's stock beside the Command
#            Centre's mirror of it, property by property: live on both sides
#            and nothing extra, the same values and photograph, a property the
#            builder removed live on neither side nor re-inserted for the same
#            source row, one property per source row, and no list tail in a
#            suburb. Prints fields and lots, never values. Takes
#            `organisation_id`.
#   stock-delivery-audit
#            READ-ONLY. What one builder organisation's property deliveries
#            actually did since doc 70 went live (`20261001150000` and the
#            wave worker), read from BOTH databases: each transaction's
#            events queued, superseded, delivered and retried; the newest
#            event per property the one sent and nothing superseded ever
#            sent; the Command Centre's receipt of every delivery, the waves
#            they arrived in, whether a retry's first attempt had landed; the
#            mirror at the newest delivered version for every live property;
#            no other event type superseded, nothing waiting or dead, no
#            property row written; and the deployed SQL functions and
#            triggers that write a property event. Prints ids (8 characters)
#            and counts, never values. Takes `organisation_id`.
#   portal-functionality-state
#            READ-ONLY. Why five Builder / Developer Portal surfaces read the
#            way they do: projects by organisation and status with how each was
#            opened, the project-access grants beside the organisation's active
#            members, and PER USER the product's own accessible-set functions
#            replayed for the `projects` and `tasks` keys (the Projects page and
#            the Tasks picker can legitimately disagree, and only this says
#            which); the task rows by scope; the workspace summary the attention
#            card draws; the outstanding states beside it; every activity action
#            with whether its actor is recoverable; what a user's own visible
#            feed holds; the project conversations against the agency threads;
#            and the status history with who wrote it. SELECT only. Prints ids
#            (8 characters), statuses, action names and counts — never a name,
#            address or any other customer value.
#   stock-tier0-edges
#            TIER-0: what a builder gets when the file or the click is wrong —
#            refused files with actionable reasons, malformed / partial /
#            duplicate / unusual / Unicode / oversized content read without
#            invention, the same upload processed twice at once, two lists
#            uploaded one after the other, "Read again", rights, another
#            organisation's ids, and links that must never be fetched.
#            Detached organisations only. Deletes everything it creates.
#   cc-page-probe
#            which of its FIXED states the Command Centre shows a staff member
#            who is NOT a superadmin: one disposable staff member (Listings +
#            Client Management) opens a Builder Stock property page for an id
#            that exists nowhere — a page that cannot draw genuine data — at
#            desktop and phone widths, and the run prints the product's own
#            state wording it met and every function it called with the status.
#            No page text, no screenshot (this repository is public). Deletes
#            the staff member and session.
#   cc-property-page-proof
#            the Command Centre's property page in a real Chromium, read by its
#            structure: every check requires the product's OWN page first (no
#            Cloudflare challenge, 4xx/5xx, sign-in, error or guard page), and
#            the custom domain is asked first — where it challenges, the
#            Command Centre's first-party Lovable origin (in its CORS/CSRF
#            allow-lists) is used and the run says so. Proof builder, real
#            upload, publication, mirror and re-read; every figure, the photo's
#            bytes, links, removed vs live, three widths. No screenshot.
#            Deletes everything it creates on both sides.
#   stock-worker-fault-proof
#            controlled failure injection on synthetic organisations: a live
#            property owing a badge clean-up meets every way the heavy-work
#            worker fails (500, 503, reset, no answer, late answer, malformed,
#            empty, HTML), each run through the deployed settler's own two calls
#            in Deno with the worker replaced by a local fault; then the deployed
#            settler and the real worker recover it while the Builder Portal page
#            (never reloaded) and the Command Centre are watched. Deletes
#            everything it creates on both sides.
#   portal-controls-proof
#            the offered actions no other proof reached, on an organisation of
#            the run's own (detached, proof-only transport) with a published
#            list and one real Command Centre activation: signed-in devices
#            (revoke one, sign out this one, revoke all others), join requests
#            (approve, decline), a project's status change and its history, a
#            record's tasks, "Add user" and "Send again" in an agency thread,
#            and a list's "Source images" and "Refresh brochure links" — each
#            for a role that may act and one that may not, with the effect
#            read from the database. Then, in a real Chromium, the controls no
#            other browser proof pressed (bell, user menu, organisation
#            switcher, phone drawer, thread send, task status, schedule
#            dialog, project status, device revocation, password toggle).
#            Deletes everything it creates.
#   storage-residue-sweep
#            the files proofs left in the Builder's stock buckets: in a stock
#            bucket, under an organisation that no longer exists, named by no
#            row, AND at a path a proof writes (proofResidue.pure.mjs). A real
#            builder's disowned files are kept and counted. Dry run by default,
#            by kind, count and a digest of the set (no file name: this log is
#            public);
#            removes only with apply=true AND items = the digest the dry run
#            printed.
#   portal-ui-audit
#            the portal as each role sees it: an organisation of the run's own
#            (detached, proof-only transport) holding a published stock list,
#            two Command Centre activations, a project, tasks, notifications
#            and an agency conversation, and five people (owner,
#            administrator, manager, member, read-only). Every offered route
#            for every role at desktop, laptop, tablet and phone widths (no
#            script error, no 5xx, no sideways scroll, its content present),
#            the controls a builder uses with this role's expected answer, the
#            guided tour, the public pages, and a second sign-in attempt after
#            a failed one (CAPTCHA script stubbed, login answer mocked: the
#            browser's own logic is measured and no account is touched).
#            Playwright is installed for this phase only; screenshots are the
#            run's artifact. Deletes everything on both sides.
#   network-connection-remap
#            points the live connection at the builder organisation named in
#            `organisation_id` and backfills its active stock. It refuses
#            unless the CLONE already names that organisation — the clone
#            CONSUMES an organisation_mismatch rather than retrying it, so
#            going first here would burn the whole backfill — and a clone that
#            cannot be read is a refusal too, because a check that could not
#            be made is not a check that passed. Also refuses a target with no
#            active stock, a second live connection already serving it, and a
#            connection with no usable transport. Writes ONE column plus a
#            `workspace_connection_events` row; moves no secret.
#            DRY RUN unless `apply` is true; idempotent.
#
# Secrets used (never printed; SQL text is never logged):
#   SUPABASE_ACCESS_TOKEN   Management API (same token the deploy uses)
#   NETWORK_INTERNAL_SECRET vault: internal_edge_secret (apply phase)
#   NETWORK_SESSION_PEPPER  smoke: mint session/verification token hashes

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'verify | apply | proxy-trust | smoke | recover | forensics | item-state | item-reopen | stock-collateral-reprocess | network-sync-state | network-connection-remap | portal-scope-state | stock-source-restore | stock-import-proof | stock-reading-trace | stock-scan-proof | stock-confirmation-proof | stock-project-proof | stock-agencies-proof | stock-media-proof | stock-messaging-proof | agency-chat-state | step6-proof-audit | agency-chat-backfill | stock-private-chat-proof | portal-access-proof | portal-browser-proof | portal-performance-proof | activation-speed-proof | message-speed-proof | cc-frontend-build | stock-overlay-audit | upload-settlement-state | stock-field-coverage | stock-brochure-figures | email-delivery-proof | stock-tier0-formats | stock-tier0-lifecycle | stock-tier0-edges | stock-link-proof | stock-mirror-parity | stock-delivery-audit | portal-functionality-state | portal-ui-audit | cc-page-probe | storage-residue-sweep | portal-controls-proof | photo-source-probe | cc-property-page-proof | stock-worker-fault-proof | stock-hero-future-proof | stock-upload-failure-state'
        required: true
        default: 'verify'
        type: choice
        options: [verify, apply, proxy-trust, smoke, recover, forensics, item-state, item-reopen, stock-collateral-reprocess, network-sync-state, network-connection-remap, portal-scope-state, stock-source-restore, stock-import-proof, stock-reading-trace, stock-scan-proof, stock-confirmation-proof, stock-project-proof, stock-agencies-proof, stock-media-proof, stock-messaging-proof, agency-chat-state, step6-proof-audit, agency-chat-backfill, stock-private-chat-proof, portal-access-proof, portal-browser-proof, portal-performance-proof, activation-speed-proof, message-speed-proof, cc-frontend-build, stock-overlay-audit, upload-settlement-state, stock-field-coverage, stock-brochure-figures, email-delivery-proof, stock-tier0-formats, stock-tier0-lifecycle, stock-tier0-edges, stock-link-proof, stock-mirror-parity, stock-delivery-audit, portal-functionality-state, portal-ui-audit, cc-page-probe, storage-residue-sweep, portal-controls-proof, photo-source-probe, cc-property-page-proof, stock-worker-fault-proof, stock-hero-future-proof, stock-upload-failure-state]
      items:
        description: 'item-state / item-reopen / forensics: comma-separated stock item ids (blank = the default set; forensics: every property without a ready builder photograph). stock-reading-trace: pages to print in full (blank = 1). storage-residue-sweep: with apply, the digest its dry run printed'
        required: false
        default: ''
        type: string
      organisation_id:
        description: 'network-connection-remap: the builder organisation the connection should serve (uuid). stock-mirror-parity / stock-delivery-audit: the builder organisation to compare or audit, read-only (uuid)'
        required: false
        default: ''
        type: string
      upload_id:
        description: 'stock-source-restore: the deleted stock list to put back (uuid). stock-import-proof: the stored source to import again, read-only (uuid). stock-reading-trace: stored sources to trace, read-only (uuids, comma-separated). upload-settlement-state: uploads to read, read-only (uuids, comma-separated). stock-link-proof: linked sources whose links to add again in a detached organisation (uuids, comma-separated)'
        required: false
        default: ''
        type: string
      apply:
        description: 'item-reopen / stock-collateral-reprocess / network-connection-remap / stock-source-restore / agency-chat-backfill / storage-residue-sweep: false is a dry run that writes nothing'
        required: false
        default: false
        type: boolean
      only:
        description: 'item-reopen only: which defect signature may fire (both = unchanged)'
        required: false
        default: 'both'
        type: choice
        options: [both, shared-link, brochure]
      scan_expect:
        description: 'stock-scan-proof only: observe reports what the runtime did; read also requires every page recognised once and the property read'
        required: false
        default: 'observe'
        type: choice
        options: [observe, read]
      baseline:
        description: 'message-speed-proof only: true measures whatever is deployed now (before a change) and skips what is not there yet'
        required: false
        default: false
        type: boolean
      cc_build:
        description: 'cc-frontend-build only: the Command Centre commit the published frontend should be (7-40 hex characters); blank records what is served'
        required: false
        default: ''
        type: string
      email_recipient:
        description: 'email-delivery-proof only: ONE mailbox the operator controls. Never committed and never printed — only its domain appears in the log. A reserved name (example.com and the like) is refused, because a pass against one would mean nothing.'
        required: false
        default: ''
        type: string

concurrency:
  group: production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        if: ${{ inputs.phase == 'forensics' || inputs.phase == 'item-state' || inputs.phase == 'item-reopen' || inputs.phase == 'stock-collateral-reprocess' || inputs.phase == 'network-sync-state' || inputs.phase == 'network-connection-remap' || inputs.phase == 'portal-scope-state' || inputs.phase == 'stock-source-restore' || inputs.phase == 'stock-reading-trace' || inputs.phase == 'stock-overlay-audit' || inputs.phase == 'upload-settlement-state' || inputs.phase == 'stock-field-coverage' || inputs.phase == 'stock-brochure-figures' || inputs.phase == 'photo-source-probe' || inputs.phase == 'stock-worker-fault-proof' || inputs.phase == 'portal-functionality-state' || inputs.phase == 'stock-upload-failure-state' }}
        with:
          deno-version: v2.x

      # The trace's view of what a page SHOWS beyond its text layer: poppler
      # draws the page as a viewer does and Tesseract reads it. Both are fed
      # through pipes; see `traceWhatTheTextLayerCannotSee`.
      - name: page renderer and OCR for the reading trace and forensics
        if: ${{ inputs.phase == 'stock-reading-trace' || inputs.phase == 'forensics' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr

      - name: refuse to pretend
        if: ${{ env.TOKEN == '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo '::error::SUPABASE_ACCESS_TOKEN is not configured — nothing can run against the live project.'
          exit 1

      # A BROWSER FOR THE PHASES THAT LOOK AT PAGES, installed here — in a step
      # that holds no secret — into a prefix of its own with install scripts
      # off. It used to be `npm install --no-package-lock` inside the step
      # below, which resolved the repository's whole dependency tree afresh and
      # ran its install scripts beside SUPABASE_ACCESS_TOKEN and the network
      # secrets (independent review, 28 September 2026). Only the two packages
      # the proofs import are copied into place.
      - name: a browser for the proof, installed without secrets
        if: ${{ inputs.phase == 'message-speed-proof' || inputs.phase == 'portal-browser-proof' || inputs.phase == 'stock-tier0-lifecycle' || inputs.phase == 'portal-ui-audit' || inputs.phase == 'cc-page-probe' || inputs.phase == 'portal-controls-proof' || inputs.phase == 'cc-property-page-proof' || inputs.phase == 'stock-worker-fault-proof' }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p node_modules
          cp -R "$RUNNER_TEMP/pw/node_modules/playwright" "$RUNNER_TEMP/pw/node_modules/playwright-core" node_modules/

      - name: run phase ${{ inputs.phase }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NETWORK_INTERNAL_SECRET: ${{ secrets.NETWORK_INTERNAL_SECRET }}
          NETWORK_SESSION_PEPPER: ${{ secrets.NETWORK_SESSION_PEPPER }}
          # Browser Run (Cloudflare's signed Chromium) for the Command Centre page
          # proof ONLY; every other phase receives empty values.
          CLOUDFLARE_API_TOKEN: ${{ inputs.phase == 'cc-property-page-proof' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.phase == 'cc-property-page-proof' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          # Through the ENVIRONMENT, never interpolated into the script below:
          # a dispatch input in a `run:` body is shell injection, and this one
          # is a list a person types. The script validates every id as a uuid
          # before it reaches a statement, which is the second half of the same
          # rule.
          STOCK_ITEM_IDS: ${{ inputs.items }}
          FORENSICS_ITEM_IDS: ${{ inputs.items }}
          TARGET_ORGANISATION_ID: ${{ inputs.organisation_id }}
          RESTORE_UPLOAD_ID: ${{ inputs.upload_id }}
          PROOF_UPLOAD_ID: ${{ inputs.upload_id }}
          TRACE_UPLOAD_IDS: ${{ inputs.upload_id }}
          UPLOAD_IDS: ${{ inputs.upload_id }}
          TRACE_PAGES: ${{ inputs.items }}
          APPLY: ${{ inputs.apply }}
          ONLY: ${{ inputs.only }}
          SCAN_PROOF_EXPECT: ${{ inputs.scan_expect }}
          MESSAGE_PROOF_BASELINE: ${{ inputs.baseline }}
          CC_EXPECTED_BUILD: ${{ inputs.cc_build }}
          PROOF_EMAIL_RECIPIENT: ${{ inputs.email_recipient }}
          TIER0_ONLY: ${{ inputs.items }}
          SWEEP_EXPECT: ${{ inputs.items }}
        run: |
          set -euo pipefail
          case "${{ inputs.phase }}" in
            verify|apply|recover) node scripts/ops/production-rollout.mjs "${{ inputs.phase }}" ;;
            proxy-trust)          node scripts/ops/verify-proxy-ip-handshake.mjs ;;
            smoke)                node scripts/ops/production-smoke.mjs ;;
            forensics)            deno run -A --config supabase/functions/deno.json scripts/ops/stock-source-forensics.ts ;;
            item-state)           deno run -A --config supabase/functions/deno.json scripts/ops/stock-item-state.ts ;;
            item-reopen)          deno run -A --config supabase/functions/deno.json scripts/ops/stock-item-reopen.ts ;;
            stock-collateral-reprocess)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-collateral-reprocess.ts ;;
            network-sync-state)   deno run -A --config supabase/functions/deno.json scripts/ops/network-sync-state.ts ;;
            network-connection-remap)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/network-connection-remap.ts ;;
            portal-scope-state)   deno run -A --config supabase/functions/deno.json scripts/ops/builder-portal-scope-state.ts ;;
            stock-source-restore) deno run -A --config supabase/functions/deno.json scripts/ops/stock-source-restore.ts ;;
            stock-import-proof)   node scripts/ops/stock-import-proof.mjs ;;
            stock-reading-trace)  deno run -A --config supabase/functions/deno.json scripts/ops/stock-reading-trace.ts ;;
            stock-scan-proof)     node scripts/ops/stock-scan-proof.mjs ;;
            stock-confirmation-proof) node scripts/ops/stock-confirmation-proof.mjs ;;
            stock-project-proof) node scripts/ops/stock-project-proof.mjs ;;
            stock-agencies-proof) node scripts/ops/stock-agencies-proof.mjs ;;
            stock-media-proof)   node scripts/ops/stock-media-proof.mjs ;;
            stock-hero-future-proof) node scripts/ops/stock-hero-future-proof.mjs ;;
            stock-messaging-proof) node scripts/ops/stock-messaging-proof.mjs ;;
            agency-chat-state)   node scripts/ops/agency-chat-state.mjs ;;
            step6-proof-audit)   node scripts/ops/step6-proof-audit.mjs ;;
            agency-chat-backfill) node scripts/ops/agency-chat-backfill.mjs ;;
            stock-private-chat-proof) node scripts/ops/stock-private-chat-proof.mjs ;;
            portal-access-proof) node scripts/ops/portal-access-proof.mjs ;;
            portal-performance-proof) node scripts/ops/portal-performance-proof.mjs ;;
            activation-speed-proof) node scripts/ops/activation-speed-proof.mjs ;;
            message-speed-proof)
                                  node scripts/ops/message-speed-proof.mjs ;;
            cc-frontend-build)    node scripts/ops/cc-frontend-build.mjs ;;
            portal-browser-proof)
                                  node scripts/ops/portal-browser-proof.mjs ;;
            stock-overlay-audit)  deno run -A --config supabase/functions/deno.json scripts/ops/stock-overlay-audit.ts ;;
            upload-settlement-state)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-upload-settlement-state.ts ;;
            stock-field-coverage) deno run -A --config supabase/functions/deno.json scripts/ops/stock-field-coverage.ts ;;
            stock-brochure-figures)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-brochure-figures.ts ;;
            email-delivery-proof) node scripts/ops/email-delivery-proof.mjs ;;
            stock-tier0-formats)  node scripts/ops/stock-tier0-formats.mjs ;;
            stock-tier0-lifecycle)
                                  node scripts/ops/stock-tier0-lifecycle.mjs ;;
            stock-tier0-edges)    node scripts/ops/stock-tier0-edges.mjs ;;
            stock-link-proof)     node scripts/ops/stock-link-proof.mjs ;;
            stock-mirror-parity)  node scripts/ops/stock-mirror-parity.mjs ;;
            stock-delivery-audit) node scripts/ops/stock-delivery-audit.mjs ;;
            stock-upload-failure-state)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-upload-failure-state.ts ;;
            portal-functionality-state)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/portal-functionality-state.ts ;;
            portal-ui-audit)
                                  node scripts/ops/portal-ui-audit.mjs ;;
            cc-page-probe)
                                  node scripts/ops/cc-page-probe.mjs ;;
            cc-property-page-proof)
                                  node scripts/ops/cc-property-page-proof.mjs ;;
            stock-worker-fault-proof)
                                  node scripts/ops/stock-worker-fault-proof.mjs ;;
            storage-residue-sweep)
                                  node scripts/ops/storage-residue-sweep.mjs ;;
            portal-controls-proof)
                                  node scripts/ops/portal-controls-proof.mjs ;;
            photo-source-probe)   deno run -A --config supabase/functions/deno.json scripts/ops/photo-source-probe.ts ;;
          esac

      - name: upload the browser proof's screenshots
        if: ${{ always() && inputs.phase == 'portal-browser-proof' }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-proof
          path: proof-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: upload the Tier-0 lifecycle screenshots
        if: ${{ always() && (inputs.phase == 'stock-tier0-lifecycle' || inputs.phase == 'portal-ui-audit') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.phase }}
          path: proof-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: upload the message proof's screenshots
        if: ${{ always() && inputs.phase == 'message-speed-proof' }}
        uses: actions/upload-artifact@v4
        with:
          name: message-speed-proof
          path: proof-artifacts/
          if-no-files-found: warn
          retention-days: 7
