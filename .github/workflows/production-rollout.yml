name: Production rollout

# Applies pending database migrations to the LIVE Supabase project and runs
# the production smoke suite — the repository's migration procedure from the
# remediation onward. Manual dispatch only, one phase at a time:
#
#   verify   read-only: live ledger, pending migrations, divergence, vault
#            entry names, extensions, cron jobs. Run this first, always.
#   apply    apply pending migrations in order (never the baseline), record
#            them in the ledger, prove the remediation objects, ensure
#            pg_cron/pg_net + the two network driver schedules, and seed the
#            Vault entries the signed cron invoker reads.
#   proxy-trust
#            proves the portal proxy's client-IP handshake against the LIVE
#            system: that the runtime holds PORTAL_PROXY_SHARED_SECRET, that a
#            proxied call is charged to the BROWSER's address rather than the
#            proxy's, and that a direct caller claiming someone else's address
#            is ignored without the token. Creates no account and no business
#            row; deletes the identifier buckets it makes.
#   smoke    controlled end-to-end tests over the deployed portal: the
#            governance journey, self-registration, the active surfaces,
#            the Stock List including a live HMAC-signed selection
#            announcement round trip, and cleanup of every test row.
#   recover  the one-time (re-runnable, idempotent) historical recovery for
#            the stock image invariant: re-opens served/staged properties
#            without a ready builder-source photograph back through the
#            corrected pipeline, kicks the workers, flips the temporary
#            invariant scoping to universal as coverage is earned.
#   forensics read-only source audit for properties still without a ready
#            builder-source photograph: fetches every link their stored rows
#            carry (resolving Drive's virus-scan interstitial), censuses each
#            PDF page-by-page with the pipeline's own readers, and replays the
#            pipeline's own recovery/election per branch. Writes nothing.
#   item-state
#            read-only: the exact stored state of named stock items — the rows
#            themselves, their branch records, their stored images and the
#            uploads either side of the cutover. Answers "what does the
#            database say happened to these rows", which is the question that
#            comes before what their documents contain. Runs SELECT only, and
#            refuses any statement that is not one. Writes nothing.
#            Ids come from the `items` input, defaulting to the five the
#            18 September import retired.
#   stock-collateral-reprocess
#            sends every ACTIVE property whose card is led by a picture from a
#            column the builder's own heading declares to be estate or plan
#            collateral back to `source`, so the corrected pipeline reads the
#            brochure it never opened. Selected BY THE RULE
#            (`columnDeclaration.pure.ts`, imported rather than restated) and
#            never by a list of ids. Writes only the image work state: no
#            image, no primary, no lifecycle, no publication, and it deletes
#            nothing. DRY RUN unless `apply` is true; idempotent.
#            MUST RUN AFTER the functions carrying the rule are deployed — the
#            old code still counts a masterplan as a ready image and would
#            re-settle every row this resets.
#   item-reopen
#            the narrowest recovery for a property the two 18 September defects
#            retired: removes ONLY the banked branch verdicts that match those
#            two signatures — a recovery whose image is not marketplace
#            eligible, and the row's own `Brochure URL` banked as naming no
#            image — and resets the work state. Writes no image, sets no
#            primary, settles nothing, publishes nothing, never touches
#            `lifecycle_status`. DRY RUN unless `apply` is true; idempotent.
#   network-sync-state
#            read-only: THIS end of the Network -> Clone stock sync, printed in
#            the order an event travels it — the catalogue, the connection the
#            events are addressed to, the enqueue's own organisation join, the
#            three producer triggers and whether they are enabled, the outbox
#            by status, the worker's cron driver, and `net._http_response`,
#            which is the honest signal because pg_cron reports on the SQL that
#            QUEUED the HTTP call and never on the call. Its counterpart is
#            `builder-network-sync-state` on `npc-property-dashbord`: a stopped
#            mirror can be caused at either end and neither database can see
#            the other. Runs SELECT only and refuses any statement that is not
#            one. Enqueues nothing, backfills nothing, delivers nothing.
#   portal-scope-state
#            read-only: WHOSE stock a builder's own Stock List page would draw.
#            Every read in `builder-portal-stock` is scoped by one value — the
#            session's active organisation — so an empty page and a full
#            marketplace can both be correct answers about two different
#            organisations, and the screen cannot tell you which. Prints what
#            each organisation holds, which organisations each portal user can
#            actually reach (through the session resolver's own function), what
#            each live session is acting as, the two page reads replayed per
#            user, and who uploaded each stock list beside who owns it. Runs
#            SELECT only and refuses any statement that is not one. Grants
#            nothing, re-points nothing, writes nothing.
#   stock-source-restore
#            puts back a stock list the builder deleted in order to re-import
#            it — the exact inverse of ONE logged `builder_stock_source_deleted`
#            and nothing more. It imports nothing, fetches nothing and creates
#            no upload row. The photograph rule is NOT relaxed to restore a
#            row: a property returns to `active` only where
#            `builder_stock_photo_is_source_ready` says it holds a ready
#            builder-source photograph, and everything else returns to `staged`,
#            which is where publication would have left it. It refuses unless
#            the count matches what that delete recorded (something else has
#            touched the catalogue since), refuses if a newer undeleted upload
#            is already supplying active stock, and asserts by re-reading.
#            Takes `upload_id`. DRY RUN unless `apply` is true; idempotent.
#   stock-reading-trace
#            read-only: what the deterministic PDF reader SAW in named stored
#            documents and what it made of them — the flattened page text, every
#            positioned run with its size, the reader's own lines and cells, and
#            the reading with the lines it set aside. Runs the pipeline's own
#            readers over the stored bytes with the inputs the import hands
#            them. Takes `upload_id` (one or more, comma-separated). SELECT and
#            a storage GET only; writes nothing.
#   stock-overlay-audit
#            read-only: every distinct stored picture with a display verdict
#            put through the marketing-overlay reading again — where each strict
#            line of type sits, whether it reaches a side of the frame, the flat
#            blocks and whether any is a brand colour — and each picture a
#            proposed rule about those lines would judge differently printed
#            for inspection. SELECT and a storage GET only; writes nothing.
#   stock-scan-proof
#            imports a SAFE fully scanned fixture (`scripts/ops/fixtures/
#            scanned-brochure-lot-57.pdf`, digest pinned in the script) through
#            the deployed product, the way a builder's browser does, into an
#            organisation of the run's own that is detached from the network in
#            the transaction that creates it — and then does nothing, so what
#            finishes the import is the product's own dispatch and continuation.
#            Reports whether the hosted runtime's recogniser came up, every page
#            recognised or refused, the engine's own refusal from the function
#            log, the property read and every invocation's HTTP status. Deletes
#            every row and object it made. `scan_expect: observe` reports;
#            `read` also requires every page recognised once and the document's
#            property read field for field.
#   stock-confirmation-proof
#            proves "Use brochure image" on the live product with the gate's own
#            SALTBUSH RISE brochures (`scripts/ops/fixtures/saltbush-lot-*.pdf`,
#            digests pinned in the script, nothing in them any customer's),
#            served from this project's storage under signed links, in an
#            organisation of the run's own that is detached from the network in
#            the transaction that creates it. Through the portal, as a builder's
#            browser: a row whose own brochure mistypes its lot is offered the
#            choice, a row linking a sibling's brochure is refused naming the
#            listing that uses it, confirming puts the brochure's own photograph
#            on the card stamped with the confirmation, and undoing takes it down
#            and brings the notice back. Deletes every row and object it made.
#   stock-project-proof
#            proves an activated property's PROJECT page on the live product: a
#            stock list (the gate's own SALTBUSH RISE brochure, digest-pinned)
#            imported in an organisation of the run's own, detached from the
#            network, whose property reads its photograph; an activation
#            delivered through the live network door over a proof-only
#            workspace connection (production-smoke's precedent) opening a
#            project; get_project and list_projects carrying the property with
#            its photograph, every figure equal to the Stock List's own read and
#            its brochure link; image_url serving the photograph's bytes and
#            refusing a foreign image and another organisation; and a party
#            added, edited and removed with project access unchanged. Deletes
#            every row, object, workspace and connection it made.
#   stock-agencies-proof
#            proves the Builder Portal's Agencies area on the live product: the
#            same organisations of the run's own and SALTBUSH RISE import as
#            stock-project-proof, an activation delivered through the live
#            network door (carrying a client label the area must never show; a
#            payload naming a client refused at the door), then
#            list_activated_properties for the organisation's builder — its
#            property, design, photograph (bytes served), agency, contact and
#            project link, and nothing withheld — and for another organisation,
#            before and after being listed as a party on the project: nothing.
#            Also checks the deployed portal serves the route and bundles the
#            area, and counts (read-only) real activations holding a client
#            label. Deletes every row, object, workspace and connection it made.
#   stock-media-proof
#            proves a property's photographs and documents reach the Command
#            Centre over the real signed path: a never-activated organisation of
#            the run's own, one property with two stored photographs and two
#            document links, a proof-only transport between the two LIVE inbound
#            doors; checks the figures, the one elected photograph (its bytes
#            through the network door), the typed documents and the Command
#            Centre's own get_stock_item; replay, replacement, removal and a
#            changed document; another organisation's signed payload refused; a
#            malformed media block refused while the property takes the event.
#            Reaches the Command Centre project with the same token
#            network-connection-remap uses. Deletes everything on both sides.
#   stock-messaging-proof
#            proves Step 5's messages over the real signed path, both ways: two
#            organisations of the run's own on a proof-only transport between the
#            two LIVE doors, a Command Centre activation by a proof staff member
#            (for a proof client no trigger may react to), messages from the
#            activator, a colleague, the builder (through the portal's own
#            request) and a builder colleague — each under its writer's name and
#            Delivered only on the other side's receipt; the same send repeated,
#            one order on both sides, a refusal that fails visibly and is sent
#            again once, a replayed envelope, another builder's / the wrong
#            conversation's / a malformed signed message refused with a valid one
#            behind them applied, the operational log, the exact payload keys,
#            the polling read, and a withdrawal that closes the conversation.
#            Deletes everything on both sides.
#   agency-chat-state
#            read-only: who each existing agency conversation belongs to, on
#            both projects, before one activation, one private conversation.
#   step6-proof-audit
#            read-only: counts, table by table on both projects, anything the
#            Step 6 and regression proofs could have left (proof markers and
#            rows whose parent no longer exists), and re-reads the two real
#            agency conversations. Every statement is a single SELECT.
#   agency-chat-backfill
#            binds each conversation that existed before that step to its
#            activation and seeds its activator and acknowledger — only where
#            both projects agree; everything else is reported by id. Sends no
#            notification or email. Works before the migrations (reports the
#            mapping) and after them. DRY RUN unless `apply` is true;
#            idempotent.
#   stock-private-chat-proof
#            proves one activation, one private conversation on the live
#            product with proof organisations, users and an activation of its
#            own: the acknowledgement's conversation, notification and email,
#            the company contacts, who may read, invite and leave on each side,
#            participant events converging, withdrawal, and nothing private
#            crossing. Deletes everything on both sides.
#   portal-access-proof
#            proves a brand-new builder organisation end to end on the live
#            portal: governance from empty rows, an invitation for every role,
#            the session windows (idle slide, idle and absolute expiry, logout,
#            deactivation, revocation, suspension, password change and reset),
#            the role matrix against the database resolvers, a project
#            conversation, notifications and multi-tenant isolation. Its
#            organisations are detached from every workspace in the
#            transaction that creates them. Deletes everything it creates.
#   portal-browser-proof
#            opens the live portal in a real Chromium, signed in as a proof
#            organisation of its own: every live route renders, the old
#            bookmarks redirect, an open project conversation shows a reply
#            without a reload, the newer-build banner appears, phone width
#            fits. Screenshots are uploaded as the run's artifact. Playwright
#            is installed for this phase only (never saved to package.json).
#            Deletes everything it creates.
#   upload-settlement-state
#            read-only: why an upload's image settlement does not finish. For
#            each property carrying the upload, judged by the pipeline's own
#            rules (`openBranches`, `servableStoredImage`) at the versions the
#            deployed settler asks for: whether it already holds a picture the
#            repair counts, which of its branches are still open and what each
#            stored answer says — and so whether the upload-level repair owes
#            it a package recovery. Prints no link (host, kind and a digest
#            only). Runs SELECT only and refuses any statement that is not
#            one. Takes `upload_id` (one or more, comma-separated).
#   stock-field-coverage
#            read-only: how many live properties are missing each displayed
#            figure, per stock list, and for every one missing a car count or
#            a floor area, what its own stored record carries under headers
#            that read like either. Prints no link (host and a digest only).
#            Runs SELECT only and refuses any statement that is not one.
#   stock-brochure-figures
#            read-only: for every live property missing a car count or a floor
#            area, fetches its own brochure (the one its photograph came from,
#            else its Brochure URL) through the product's fetcher and runs the
#            deterministic PDF reader over it, printing the figures read and
#            whether the brochure's lot and design agree with the row's.
#            SELECT and a document GET only; prints no link; writes nothing.
#   network-connection-remap
#            points the live connection at the builder organisation named in
#            `organisation_id` and backfills its active stock. It refuses
#            unless the CLONE already names that organisation — the clone
#            CONSUMES an organisation_mismatch rather than retrying it, so
#            going first here would burn the whole backfill — and a clone that
#            cannot be read is a refusal too, because a check that could not
#            be made is not a check that passed. Also refuses a target with no
#            active stock, a second live connection already serving it, and a
#            connection with no usable transport. Writes ONE column plus a
#            `workspace_connection_events` row; moves no secret.
#            DRY RUN unless `apply` is true; idempotent.
#
# Secrets used (never printed; SQL text is never logged):
#   SUPABASE_ACCESS_TOKEN   Management API (same token the deploy uses)
#   NETWORK_INTERNAL_SECRET vault: internal_edge_secret (apply phase)
#   NETWORK_SESSION_PEPPER  smoke: mint session/verification token hashes

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'verify | apply | proxy-trust | smoke | recover | forensics | item-state | item-reopen | stock-collateral-reprocess | network-sync-state | network-connection-remap | portal-scope-state | stock-source-restore | stock-import-proof | stock-reading-trace | stock-scan-proof | stock-confirmation-proof | stock-project-proof | stock-agencies-proof | stock-media-proof | stock-messaging-proof | agency-chat-state | step6-proof-audit | agency-chat-backfill | stock-private-chat-proof | portal-access-proof | portal-browser-proof | stock-overlay-audit | upload-settlement-state | stock-field-coverage | stock-brochure-figures'
        required: true
        default: 'verify'
        type: choice
        options: [verify, apply, proxy-trust, smoke, recover, forensics, item-state, item-reopen, stock-collateral-reprocess, network-sync-state, network-connection-remap, portal-scope-state, stock-source-restore, stock-import-proof, stock-reading-trace, stock-scan-proof, stock-confirmation-proof, stock-project-proof, stock-agencies-proof, stock-media-proof, stock-messaging-proof, agency-chat-state, step6-proof-audit, agency-chat-backfill, stock-private-chat-proof, portal-access-proof, portal-browser-proof, stock-overlay-audit, upload-settlement-state, stock-field-coverage, stock-brochure-figures]
      items:
        description: 'item-state / item-reopen / forensics: comma-separated stock item ids (blank = the default set; forensics: every property without a ready builder photograph). stock-reading-trace: pages to print in full (blank = 1)'
        required: false
        default: ''
        type: string
      organisation_id:
        description: 'network-connection-remap: the builder organisation the connection should serve (uuid)'
        required: false
        default: ''
        type: string
      upload_id:
        description: 'stock-source-restore: the deleted stock list to put back (uuid). stock-import-proof: the stored source to import again, read-only (uuid). stock-reading-trace: stored sources to trace, read-only (uuids, comma-separated). upload-settlement-state: uploads to read, read-only (uuids, comma-separated)'
        required: false
        default: ''
        type: string
      apply:
        description: 'item-reopen / stock-collateral-reprocess / network-connection-remap / stock-source-restore / agency-chat-backfill: false is a dry run that writes nothing'
        required: false
        default: false
        type: boolean
      only:
        description: 'item-reopen only: which defect signature may fire (both = unchanged)'
        required: false
        default: 'both'
        type: choice
        options: [both, shared-link, brochure]
      scan_expect:
        description: 'stock-scan-proof only: observe reports what the runtime did; read also requires every page recognised once and the property read'
        required: false
        default: 'observe'
        type: choice
        options: [observe, read]

concurrency:
  group: production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        if: ${{ inputs.phase == 'forensics' || inputs.phase == 'item-state' || inputs.phase == 'item-reopen' || inputs.phase == 'stock-collateral-reprocess' || inputs.phase == 'network-sync-state' || inputs.phase == 'network-connection-remap' || inputs.phase == 'portal-scope-state' || inputs.phase == 'stock-source-restore' || inputs.phase == 'stock-reading-trace' || inputs.phase == 'stock-overlay-audit' || inputs.phase == 'upload-settlement-state' || inputs.phase == 'stock-field-coverage' || inputs.phase == 'stock-brochure-figures' }}
        with:
          deno-version: v2.x

      # The trace's view of what a page SHOWS beyond its text layer: poppler
      # draws the page as a viewer does and Tesseract reads it. Both are fed
      # through pipes; see `traceWhatTheTextLayerCannotSee`.
      - name: page renderer and OCR for the reading trace and forensics
        if: ${{ inputs.phase == 'stock-reading-trace' || inputs.phase == 'forensics' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr

      - name: refuse to pretend
        if: ${{ env.TOKEN == '' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo '::error::SUPABASE_ACCESS_TOKEN is not configured — nothing can run against the live project.'
          exit 1

      - name: run phase ${{ inputs.phase }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NETWORK_INTERNAL_SECRET: ${{ secrets.NETWORK_INTERNAL_SECRET }}
          NETWORK_SESSION_PEPPER: ${{ secrets.NETWORK_SESSION_PEPPER }}
          # Through the ENVIRONMENT, never interpolated into the script below:
          # a dispatch input in a `run:` body is shell injection, and this one
          # is a list a person types. The script validates every id as a uuid
          # before it reaches a statement, which is the second half of the same
          # rule.
          STOCK_ITEM_IDS: ${{ inputs.items }}
          FORENSICS_ITEM_IDS: ${{ inputs.items }}
          TARGET_ORGANISATION_ID: ${{ inputs.organisation_id }}
          RESTORE_UPLOAD_ID: ${{ inputs.upload_id }}
          PROOF_UPLOAD_ID: ${{ inputs.upload_id }}
          TRACE_UPLOAD_IDS: ${{ inputs.upload_id }}
          UPLOAD_IDS: ${{ inputs.upload_id }}
          TRACE_PAGES: ${{ inputs.items }}
          APPLY: ${{ inputs.apply }}
          ONLY: ${{ inputs.only }}
          SCAN_PROOF_EXPECT: ${{ inputs.scan_expect }}
        run: |
          set -euo pipefail
          case "${{ inputs.phase }}" in
            verify|apply|recover) node scripts/ops/production-rollout.mjs "${{ inputs.phase }}" ;;
            proxy-trust)          node scripts/ops/verify-proxy-ip-handshake.mjs ;;
            smoke)                node scripts/ops/production-smoke.mjs ;;
            forensics)            deno run -A --config supabase/functions/deno.json scripts/ops/stock-source-forensics.ts ;;
            item-state)           deno run -A --config supabase/functions/deno.json scripts/ops/stock-item-state.ts ;;
            item-reopen)          deno run -A --config supabase/functions/deno.json scripts/ops/stock-item-reopen.ts ;;
            stock-collateral-reprocess)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-collateral-reprocess.ts ;;
            network-sync-state)   deno run -A --config supabase/functions/deno.json scripts/ops/network-sync-state.ts ;;
            network-connection-remap)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/network-connection-remap.ts ;;
            portal-scope-state)   deno run -A --config supabase/functions/deno.json scripts/ops/builder-portal-scope-state.ts ;;
            stock-source-restore) deno run -A --config supabase/functions/deno.json scripts/ops/stock-source-restore.ts ;;
            stock-import-proof)   node scripts/ops/stock-import-proof.mjs ;;
            stock-reading-trace)  deno run -A --config supabase/functions/deno.json scripts/ops/stock-reading-trace.ts ;;
            stock-scan-proof)     node scripts/ops/stock-scan-proof.mjs ;;
            stock-confirmation-proof) node scripts/ops/stock-confirmation-proof.mjs ;;
            stock-project-proof) node scripts/ops/stock-project-proof.mjs ;;
            stock-agencies-proof) node scripts/ops/stock-agencies-proof.mjs ;;
            stock-media-proof)   node scripts/ops/stock-media-proof.mjs ;;
            stock-messaging-proof) node scripts/ops/stock-messaging-proof.mjs ;;
            agency-chat-state)   node scripts/ops/agency-chat-state.mjs ;;
            step6-proof-audit)   node scripts/ops/step6-proof-audit.mjs ;;
            agency-chat-backfill) node scripts/ops/agency-chat-backfill.mjs ;;
            stock-private-chat-proof) node scripts/ops/stock-private-chat-proof.mjs ;;
            portal-access-proof) node scripts/ops/portal-access-proof.mjs ;;
            portal-browser-proof)
                                  npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0 \
                                    && npx playwright install --with-deps chromium \
                                    && node scripts/ops/portal-browser-proof.mjs ;;
            stock-overlay-audit)  deno run -A --config supabase/functions/deno.json scripts/ops/stock-overlay-audit.ts ;;
            upload-settlement-state)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-upload-settlement-state.ts ;;
            stock-field-coverage) deno run -A --config supabase/functions/deno.json scripts/ops/stock-field-coverage.ts ;;
            stock-brochure-figures)
                                  deno run -A --config supabase/functions/deno.json scripts/ops/stock-brochure-figures.ts ;;
          esac

      - name: upload the browser proof's screenshots
        if: ${{ always() && inputs.phase == 'portal-browser-proof' }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-proof
          path: proof-artifacts/
          if-no-files-found: warn
          retention-days: 7
