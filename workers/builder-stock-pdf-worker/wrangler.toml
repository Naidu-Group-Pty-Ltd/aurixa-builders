# The heavy Builder Stock PDF election, deployed where there is CPU for it.
#
# `main` is the PRE-BUILT bundle, not `src/index.ts`. The shared election
# reaches for `https://esm.sh/unpdf@0.12.1` at runtime, which Workers cannot
# do; `build.mjs` rewrites that one specifier to the pinned npm package and
# inlines it, and refuses to build if the two ever name different versions.
# See its header for why the shared module is not edited instead.
name = "builder-stock-pdf-worker"
main = "dist/index.js"
compatibility_date = "2026-09-08"
workers_dev = true

# NO `[limits] cpu_ms`, AND THAT IS NOT AN OVERSIGHT.
#
# It was set to 120000 and Cloudflare refused the deployment outright:
#
#   error 100328: CPU limits are not supported for the Free plan.
#
# Raising the ceiling is a paid-plan control. Asking for it on this account
# does not get a smaller ceiling — it gets NO DEPLOYMENT, which is strictly
# worse than the default. So the key is gone and the platform default stands.
#
# WHAT THE DEFAULT ACTUALLY IS, AND WHY THIS COMMENT HEDGES. Cloudflare's own
# documentation says two things that do not sit together:
#
#   * `durable-objects/platform/limits` gives "CPU per request: 30 seconds
#     (default)" with NO plan split — while splitting the rows either side of
#     it ("500 (Workers Paid) / 100 (Free)").
#   * `workers/platform/limits` gives "CPU time per HTTP request: Workers Free
#     10 ms", and the Durable Objects FAQ says objects "have the same per
#     invocation CPU limits as any Workers do".
#
# Under the first reading the election has 30 s and finishes in half a second.
# Under the second it has 10 ms and cannot finish at all. The isolate's
# "flexibility" does not bridge that: it forgives a Worker that INFREQUENTLY
# runs over, and terminates one that does so consistently.
#
# This is therefore settled by MEASUREMENT, not by reading. The deploy workflow
# canaries the live URL with a real 8 MB brochure before it points Supabase at
# anything, so the failure mode of the pessimistic reading is a red canary and
# an unconfigured runtime — never a heavy document routed somewhere it cannot
# be read.
#
# Memory is unaffected either way: 128 MB is the isolate's ceiling and it does
# not move with the plan. The lane in `PdfElection` is what keeps one document
# resident at a time, and it is doing that job whatever the CPU budget is.

[durable_objects]
bindings = [
  { name = "PDF_ELECTION", class_name = "PdfElection" },
]

# `new_classes`, not `new_sqlite_classes`: this object stores nothing. It is a
# queue with a lifetime, and giving it storage would invite someone to use it.
[[migrations]]
tag = "v1"
new_classes = ["PdfElection"]

[observability]
enabled = true
